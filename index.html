<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evaluación de Simulacros VIME</title>
<meta name="description" content="Grupo VIME · Evaluación de simulacros de Protección Civil de campo y de gabinete.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo_aula.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: banda corporativa con logotipos → migas → espacio de trabajo en tarjetas; un simulacro se trabaja en 4 pasos (Datos · Evidencias · Evaluación · Reporte). */
:root{
  --navy:#17325c; --navy-2:#24508f; --orange:#e2711d; --gold:#f0a81c; --silver:#6d6f73;
  --ink:#1b2533; --muted:#536072; --bg:#f2f4f8; --card:#ffffff; --soft:#e9eef6; --line:#d3dbe7;
  --on-navy:#ffffff;
  --good:#1d7a4c; --good-bg:#e3f4ea; --reg:#9a6206; --reg-bg:#fdf1d8; --bad:#b42318; --bad-bg:#fbe5e2; --na:#5d6470; --na-bg:#eceef1;
  --f-brand:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif;
  --f-body:'Lexend','Segoe UI',Arial,sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#9fc0f0; --navy-2:#7fa8e6; --orange:#f39a52; --gold:#f5c04f; --silver:#b9bcc2;
  --ink:#e7ecf3; --muted:#a8b3c3; --bg:#0f1622; --card:#172131; --soft:#1e2b3f; --line:#2c3a50;
  --on-navy:#0f1622;
  --good:#6fd39e; --good-bg:#15352a; --reg:#f2c260; --reg-bg:#3a2f12; --bad:#ff8a7c; --bad-bg:#3d1c19; --na:#b3b9c3; --na-bg:#262f3d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#9fc0f0; --navy-2:#7fa8e6; --orange:#f39a52; --gold:#f5c04f; --silver:#b9bcc2;
  --ink:#e7ecf3; --muted:#a8b3c3; --bg:#0f1622; --card:#172131; --soft:#1e2b3f; --line:#2c3a50;
  --on-navy:#0f1622;
  --good:#6fd39e; --good-bg:#15352a; --reg:#f2c260; --reg-bg:#3a2f12; --bad:#ff8a7c; --bad-bg:#3d1c19; --na:#b3b9c3; --na-bg:#262f3d;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0;font-family:var(--f-brand);font-weight:700}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banda corporativa */
.brand{background:var(--card);border-bottom:1px solid var(--line)}
.brand .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.plaque{background:#fff;border-radius:10px;padding:6px 10px;display:flex;align-items:center}
.plaque img{display:block;height:64px;width:auto}
.plaque.aula img{height:58px}
.brand-title{flex:1;min-width:220px}
.brand-title h1{font-size:clamp(1.6rem,3.4vw,2.25rem);color:var(--navy);letter-spacing:.3px}
.brand-title p{color:var(--muted);font-size:1rem}
.swoosh{height:5px;background:linear-gradient(90deg,var(--orange),var(--gold) 55%,transparent)}

.statusbar{font-size:.92rem;color:var(--muted);padding-block:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--card)}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--reg);border-color:var(--reg)}

main{padding-block:10px 64px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:1rem;margin-bottom:14px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--navy-2);text-decoration:underline;cursor:pointer;font-size:1rem}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h2{font-size:clamp(1.6rem,3vw,2.1rem);color:var(--navy);font-weight:600}
.head .sub{color:var(--muted)}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:10px;border:2px solid var(--navy);background:var(--navy);color:var(--on-navy);font-weight:600;font-size:1.02rem;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--navy)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.95rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

/* Tarjetas de establecimiento */
.est{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.est:hover{border-color:var(--navy-2)}
.est h3{font-size:1.25rem;color:var(--navy)}
.est .rs{color:var(--muted);font-size:.98rem}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--soft);color:var(--ink)}
.tag.alto{background:var(--bad-bg);color:var(--bad)}
.tag.ord{background:var(--good-bg);color:var(--good)}
.tag.sci{background:var(--soft);color:var(--navy-2)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.98rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty strong{color:var(--ink);font-size:1.15rem}

/* Formularios */
.form{display:grid;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:1rem}
.field .hint{font-size:.9rem;color:var(--muted)}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],input[type=url],select,textarea{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:1.02rem}
textarea{min-height:120px;resize:vertical;line-height:1.55}
textarea.guion{min-height:340px;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--navy-2) 25%,transparent)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:inline-flex;align-items:center;min-height:48px;padding:8px 18px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500;background:var(--card)}
.seg input:checked+label{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
.seg input:focus-visible+label{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:.92rem;cursor:pointer}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:6px}

/* Pasos */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.step{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.step .n{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.step .t{font-weight:600;font-size:1.05rem}
.step .s{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on{border-color:var(--navy);box-shadow:inset 0 -4px 0 var(--orange)}
.step.done .n{color:var(--good)}
@media (max-width:640px){.steps{grid-template-columns:1fr 1fr}}

/* Evidencias */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.thumb .img{position:relative;aspect-ratio:4/3;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .no{position:absolute;top:6px;left:6px;background:var(--navy);color:var(--on-navy);font-weight:700;border-radius:6px;padding:0 8px;font-size:.85rem}
.thumb .src{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 8px;font-size:.78rem}
.thumb .body{padding:8px;display:flex;flex-direction:column;gap:6px}
.thumb input{min-height:40px;font-size:.9rem;padding:6px 10px}
.thumb .x{align-self:flex-end;background:none;border:0;color:var(--bad);cursor:pointer;font-size:.88rem;text-decoration:underline}
.drop{border:2px dashed var(--navy-2);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:color-mix(in srgb,var(--soft) 60%,transparent)}
.drop.over{background:var(--soft)}
.vlist{display:flex;flex-direction:column;gap:10px}
.vitem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.vitem a{overflow-wrap:anywhere;flex:1;min-width:0}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.frame{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.frame.sel{border-color:var(--orange)}
.frame img{display:block;width:100%}
.frame span{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-size:.78rem;border-radius:4px;padding:0 6px}

/* Evaluación */
.score{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.score .big{flex:1 1 220px;display:flex;flex-direction:column;gap:4px}
.score .big .v{font-size:2.6rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.cal{display:inline-flex;align-items:center;font-weight:700;font-size:.9rem;border-radius:6px;padding:2px 10px}
.cal.Bueno{background:var(--good-bg);color:var(--good)}
.cal.Regular{background:var(--reg-bg);color:var(--reg)}
.cal.Malo{background:var(--bad-bg);color:var(--bad)}
.cal.NA,.cal.Pendiente{background:var(--na-bg);color:var(--na)}
.punto{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px 20px;display:grid;gap:12px}
.punto.Bueno{border-left-color:var(--good)}
.punto.Regular{border-left-color:var(--reg)}
.punto.Malo{border-left-color:var(--bad)}
.punto.NA{border-left-color:var(--na)}
.punto h4{font-size:1.15rem;color:var(--navy);display:flex;gap:10px;align-items:baseline}
.punto h4 .k{font-variant-numeric:tabular-nums;color:var(--orange);font-weight:700}
.crit{font-size:.92rem;color:var(--muted)}
.rate{display:flex;flex-wrap:wrap;gap:8px}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate label{min-height:44px;display:inline-flex;align-items:center;padding:6px 16px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;font-weight:600}
.rate input:checked+label.rb{background:var(--good);border-color:var(--good);color:var(--card)}
.rate input:checked+label.rr{background:var(--reg);border-color:var(--reg);color:var(--card)}
.rate input:checked+label.rm{background:var(--bad);border-color:var(--bad);color:var(--card)}
.rate input:checked+label.rn{background:var(--na);border-color:var(--na);color:var(--card)}
.rate input:focus-visible+label{outline:3px solid var(--gold);outline-offset:2px}
.ev{font-size:.88rem;color:var(--muted)}
.conf{font-size:.82rem;color:var(--muted)}
.ai{border:1.5px solid var(--navy-2);background:color-mix(in srgb,var(--soft) 70%,var(--card));border-radius:var(--r);padding:20px;display:grid;gap:12px}
.ai h3{color:var(--navy);font-size:1.2rem}
.progress{font-size:.98rem;color:var(--navy-2);font-weight:500;min-height:1.6em}
.note{font-size:.95rem;color:var(--muted)}
.alert{border-radius:10px;padding:12px 16px;font-size:.98rem}
.alert.warn{background:var(--reg-bg);color:var(--ink);border:1px solid var(--reg)}
.alert.err{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.alert.ok{background:var(--good-bg);color:var(--ink);border:1px solid var(--good)}
.timebox{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}

table.list{width:100%;border-collapse:collapse;font-size:1rem}
table.list th,table.list td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--soft)}
.tbl{overflow-x:auto}

/* Diálogo propio */
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal .card{width:100%;max-width:720px;display:grid;gap:18px}
.modal h3{font-size:1.4rem;color:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
footer{color:var(--muted);font-size:.9rem;padding-block:24px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="brand">
  <div class="wrap">
    <div class="plaque"><img src="logo_gv.png" alt="Grupo VIME · Asesoría Corporativa Integral"></div>
    <div class="brand-title">
      <h1>Evaluación de Simulacros</h1>
      <p>Protección Civil · Simulacros de campo y de gabinete</p>
    </div>
    <div class="plaque aula"><img src="logo_aula.png" alt="Aula Virtual Grupo VIME"></div>
  </div>
  <div class="swoosh"></div>
</header>
<div class="wrap statusbar" id="status"><span class="pill">Conectando con su almacenamiento en línea…</span></div>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Grupo VIME · Asesoría Corporativa Integral · Aula Virtual Grupo VIME · www.aulavirtualgrupovime.com · contacto@grupovimeconsultoria.com</div></footer>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
"use strict";
/* ===================== Contenido técnico ===================== */
const PUNTOS = [
 {n:1,t:"Sistema de alertamiento o alarma",c:"Alerta sísmica o alarma audible y/o visible (voz, silbato, sirena, timbre, megáfono). Se percibe en todo el inmueble e inicia la respuesta. En amenaza de bomba no se activa la alarma: el aviso de voz en voz entre brigadistas es el alertamiento correcto."},
 {n:2,t:"Evacuación",c:"Total o parcial según lo planeado. Tiempo recomendado: menos de 3 minutos para cualquier tipo de emergencia y 50 segundos como máximo con alerta sísmica. En amenaza de bomba, como no se activa la alarma y el aviso corre de voz en voz entre brigadistas, la evacuación puede tardar más de 3 minutos sin que se considere deficiencia. Personas dirigidas por rutas de evacuación hacia los puntos de reunión, con orden y sin correr. Rutas de evacuación libres y debidamente señalizadas (incluidos los puntos de reunión)."},
 {n:3,t:"Activación de brigadas",c:"Brigadistas identificados (chaleco, brazalete, casco, gorra). Participación activa y con equipo de respuesta: extintores, botiquín, radio portátil, camilla. Pase de lista de brigadas en instalaciones. No se evalúa el uso de equipo de protección personal."},
 {n:4,t:"Instalaciones",c:"Puesto de Mando, Centro de Triage y Puntos de Reunión, debidamente señalizados. Con SCI: Puesto de Comando (PC), Área de Concentración de Víctimas (ACV) y Área de Espera (AE), donde los recursos (brigadistas y su equipo) pasan lista y esperan indicaciones."},
 {n:5,t:"Implementación del SCI",c:"Comandante del Incidente identificado, estructura y funciones del Sistema de Comando de Incidentes, terminología SCI, asignación de recursos (brigadistas y su equipo) a la atención de la emergencia o al Área de Espera, formularios SCI-201, SCI-207 y SCI-211 (NOM-010-SSPC-2019)."},
 {n:6,t:"Conteo de personas evacuadas",c:"Personas formadas en el punto de reunión, de preferencia en filas, para un conteo ágil y confiable; reporte del conteo a la coordinación."},
 {n:7,t:"Atención de la emergencia",c:"Respuesta a la hipótesis y al escenario: combate de fuego, atención de lesionados, búsqueda y rescate, corte de suministros, comunicación y registro de la llamada de auxilio a servicios externos. La llegada de apoyo externo (bomberos, ambulancia, Cruz Roja, SEDENA, policía) es simulada y no se evalúa."},
 {n:8,t:"Participación de usuarios y visitantes",c:"Población fija y flotante participa con orden y atiende indicaciones; atención prioritaria de adultos mayores, personas con discapacidad y niños."},
 {n:9,t:"Revisión de instalaciones y evaluación de daños",c:"Recorrido de revisión por brigadas (búsqueda y rescate, combate de incendios) para evaluar daños y condiciones seguras antes del retorno."},
 {n:10,t:"Vuelta a la normalidad",c:"Señal de fin del simulacro, retorno ordenado y supervisado, desmovilización de recursos, retiro de escenografía y reunión de retroalimentación."}
];
const ACT_GAB = [
 {n:1,t:"Inicio y pase de lista de participantes"},
 {n:2,t:"Lectura del guion y la cronología"},
 {n:3,t:"Debate y observaciones al guion y la cronología"},
 {n:4,t:"Fin del simulacro y llenado de formatos de evaluación"}
];
const HIPOTESIS = ["Sismo","Incendio","Incendio con lesionado","Sismo con lesionado","Fuga de gas","Amenaza de bomba","Inundación","Derrame de sustancia química"];
const CALS = ["Bueno","Regular","Malo"];
const VAL = {Bueno:2,Regular:1,Malo:0};

/* ===================== Utilidades ===================== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hoyISO = ()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function fFecha(iso,conHora=true){
  if(!iso) return "—";
  const d=new Date(iso.length===10?iso+"T12:00":iso); if(isNaN(d)) return iso;
  const f=d.toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  return conHora&&iso.length>10? f+", "+d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false})+" h" : f;
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esSismo(sim){return sim.alertaSismica===true}
function limiteEvac(sim){return esSismo(sim)?50:180}
function esBomba(sim){return /bomba|artefacto explosivo/i.test(sim.hipotesis||"")}
function reglaEvac(sim){return esSismo(sim)?"50 segundos como máximo (alerta sísmica)":esBomba(sim)?"3 minutos como referencia; por amenaza de bomba el aviso corre de voz en voz y puede tardar más":"menos de 3 minutos"}
// Juicio del tiempo medido: en amenaza de bomba superar 3 min no es deficiencia
function juicioEvac(sim,t){
  if(t==null) return null;
  const lim=limiteEvac(sim);
  if(t<=lim) return {cls:"Bueno",txt:"dentro del tiempo recomendado"};
  if(esBomba(sim)&&!esSismo(sim)) return {cls:"NA",txt:"supera 3 min; aceptable por amenaza de bomba (aviso de voz en voz)"};
  return {cls:"Malo",txt:"excede el tiempo recomendado"};
}
function parseMMSS(s){if(!s)return null;s=String(s).trim();const m=s.match(/^(\d{1,3}):(\d{1,2})$/);if(m)return (+m[1])*60+(+m[2]);const n=parseFloat(s);return isNaN(n)?null:n}
function fmtSeg(n){if(n==null)return "—";const m=Math.floor(n/60),s=Math.round(n%60);return m+" min "+String(s).padStart(2,"0")+" s"}

async function guardarAjustes(){ try{ await api("guardar",{col:"establecimientos",id:ID_AJUSTES,obj:{...S.ajustes,id:ID_AJUSTES,actualizado:new Date().toISOString()}}) }catch(e){ toast("No se pudo guardar la galería: "+(e.mensaje||e)); throw e } }

async function api(accion,datos={}){
  let r;
  try{ r=await fetch(CFG.url,{method:"POST",body:JSON.stringify({...datos,accion,clave:CFG.clave}),redirect:"follow"}) }
  catch(e){ throw {error:"red",mensaje:"No hay conexión con el servidor. Revise su internet."} }
  let j; try{ j=await r.json() }catch(e){ throw {error:"red",mensaje:"El servidor no respondió correctamente (código "+r.status+"). Revise el enlace del servidor."} }
  if(!j.ok){ if(j.error==="clave"){ CFG.clave=""; lsSet("vime_sim_cfg",CFG); S.ready=false; pantallaAcceso("La clave de acceso no es correcta.") } throw j }
  return j;
}
async function guardar(col,id,obj){
  obj={...obj}; delete obj.id; obj.actualizado=new Date().toISOString();
  const map=col==="establecimientos"?S.est:S.sim;
  map[id]={...obj,id};
  try{ await api("guardar",{col,id,obj}) }
  catch(e){ toast("No se pudo guardar: "+(e.mensaje||e.message||e)); throw e }
}
async function borrar(col,id){
  const map=col==="establecimientos"?S.est:S.sim; delete map[id];
  try{ await api("borrar",{col,id}) }catch(e){ toast("No se pudo eliminar: "+(e.mensaje||e)) }
}
/* Caché de fotos en el navegador (IndexedDB) para no descargarlas cada vez */
const IDB={db:null,
  async abrir(){ if(this.db) return this.db; this.db=await new Promise((res,rej)=>{const q=indexedDB.open("vime_sim_fotos",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}); return this.db },
  async get(k){ try{const db=await this.abrir();return await new Promise(r=>{const q=db.transaction("f").objectStore("f").get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null} },
  async put(k,v){ try{const db=await this.abrir();db.transaction("f","readwrite").objectStore("f").put(v,k)}catch(e){} }
};
function b64aBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||"image/jpeg"})}
function blobAB64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(b)})}
async function fotoBlob(f){
  if(S.blobs.has(f.fileId)) return S.blobs.get(f.fileId);
  let b=await IDB.get(f.fileId);
  if(!b){ const r=await api("foto",{fileId:f.fileId}); b=b64aBlob(r.b64,r.mime); IDB.put(f.fileId,b) }
  S.blobs.set(f.fileId,b); return b;
}
function fotoURL(f){
  if(S.urls.has(f.fileId)) return S.urls.get(f.fileId);
  return "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
}
let cargandoMini=false,otraVez=false;
async function cargarMiniaturas(){
  if(cargandoMini){otraVez=true;return} cargandoMini=true;
  try{
    const imgs=[...document.querySelectorAll("img[data-fid]")].filter(i=>!S.urls.has(i.dataset.fid));
    const tareas=[...new Set(imgs.map(i=>i.dataset.fid))];
    const trabajador=async()=>{ while(tareas.length){ const fid=tareas.shift();
      try{ const b=await fotoBlob({fileId:fid}); S.urls.set(fid,URL.createObjectURL(b)); document.querySelectorAll(`img[data-fid="${fid}"]`).forEach(i=>i.src=S.urls.get(fid)) }catch(e){} } };
    await Promise.all([trabajador(),trabajador(),trabajador()]);
  }finally{ cargandoMini=false; if(otraVez){otraVez=false;cargarMiniaturas()} }
}

async function conectar(){
  const p=await api("ping"); S.ia=p.ia; S.modelo=p.modelo;
  await recargar();
}
async function recargar(){
  const d=await api("listar");
  S.est={};S.sim={};
  S.ajustes={logos:[]};
  (d.establecimientos||[]).forEach(o=>{ if(o.id===ID_AJUSTES) S.ajustes={logos:[],...o}; else S.est[o.id]=o });
  (d.simulacros||[]).forEach(o=>S.sim[o.id]=o);
  // Logotipo subido con la versión anterior (uno solo): pasa a la galería
  const viejo=lsGet("vime_sim_logo","");
  if(viejo){ if(!(S.ajustes.logos||[]).some(l=>l.fileId===viejo)){ S.ajustes.logos=[...(S.ajustes.logos||[]),{fileId:viejo,nombre:"Logotipo del asesor"}]; if(S.ajustes.logoIzq===undefined)S.ajustes.logoIzq=viejo; guardarAjustes().catch(()=>{}) } lsSet("vime_sim_logo","") }
  S.ready=true; pintarEstado(); render();
}
async function iniciar(){
  if(!CFG.url||!CFG.clave) return pantallaAcceso();
  $("#app").innerHTML='<p class="progress">Conectando con su Google Drive…</p>';
  try{ await conectar() }catch(e){ if(e.error!=="clave") pantallaAcceso(e.mensaje||String(e)) }
}

function califGlobal(ev){
  const ps=(ev?.puntos||[]).filter(p=>p.cal in VAL);
  if(!ps.length) return null;
  const pct=Math.round(ps.reduce((a,p)=>a+VAL[p.cal],0)/(ps.length*2)*100);
  return {pct,txt:pct>=85?"Bueno":pct>=60?"Regular":"Malo",n:ps.length};
}

/* ---------- Paso 2: evidencias ---------- */
async function comprimir(file,max=1600,q=.82){
  const bmp=await createImageBitmap(file);
  const r=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*r);cv.height=Math.round(bmp.height*r);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(res=>cv.toBlob(res,"image/jpeg",q));
}
async function agregarFotos(s,items){
  // items: [{blob, nota, origen, fechaArchivo}]
  trabajando=true;
  const fotos=[...(s.fotos||[])];
  try{
    for(const it of items){
      const id=uid();const f={id,nota:it.nota||"",origen:it.origen||"foto",fecha:it.fechaArchivo||""};
      const up=await api("subirFoto",{simId:s.id,b64:await blobAB64(it.blob),mime:"image/jpeg",nombre:"foto_"+id+".jpg"});
      f.fileId=up.fileId;S.blobs.set(f.fileId,it.blob);S.urls.set(f.fileId,URL.createObjectURL(it.blob));IDB.put(f.fileId,it.blob);fotos.push(f);
      const pr=$("#upProg");if(pr)pr.textContent=`Subidas ${fotos.length-(s.fotos||[]).length} de ${items.length}…`;
    }
  }catch(e){toast("No se pudo subir una foto: "+(e.mensaje||e.message||e))}
  trabajando=false;
  const o={...S.sim[s.id],fotos};delete o.id;
  await guardar("simulacros",s.id,o);render();
}

async function extraerCuadros(files,n,s){
  const z=$("#vidZone");trabajando=true;
  const mmss=t=>`${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")}`;
  const grupos=[],errores=[];
  for(let k=0;k<files.length;k++){
    const file=files[k];
    z.innerHTML=`<p class="progress">Leyendo el video ${k+1} de ${files.length}: ${esc(file.name)}…</p>`;
    const url=URL.createObjectURL(file);const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
    try{
      await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error("formato no compatible"))});
      let dur=v.duration;
      if(!isFinite(dur)){ // algunos videos (webm) no traen la duración: se obtiene saltando al final
        await new Promise(res=>{v.ondurationchange=()=>{if(isFinite(v.duration))res()};v.onseeked=()=>{if(isFinite(v.duration))res()};v.currentTime=1e101;setTimeout(res,8000)});
        dur=v.duration;v.ondurationchange=null;
      }
      if(!isFinite(dur)||dur<=0)throw new Error("duración desconocida");
      const cv=document.createElement("canvas");const r=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));cv.width=Math.round(v.videoWidth*r);cv.height=Math.round(v.videoHeight*r);
      const ctx=cv.getContext("2d");const cuadros=[];
      for(let i=0;i<n;i++){
        const t=dur*(i+.5)/n;z.innerHTML=`<p class="progress">Video ${k+1} de ${files.length} (${esc(file.name)}): cuadro ${i+1} de ${n}…</p>`;
        await new Promise(res=>{v.onseeked=res;v.currentTime=t});
        ctx.drawImage(v,0,0,cv.width,cv.height);
        const b=await new Promise(res=>cv.toBlob(res,"image/jpeg",.8));
        cuadros.push({t,blob:b,url:URL.createObjectURL(b),sel:true});
      }
      grupos.push({nombre:file.name,dur,cuadros});
    }catch(e){errores.push(`${file.name}: ${e.message}`)}
    finally{URL.revokeObjectURL(url)}
  }
  if(!grupos.length){z.innerHTML=`<div class="alert err">No se pudo procesar ningún video (${esc(errores.join("; "))}). Pruebe con archivos MP4 (H.264).</div>`;trabajando=false;return}
  const todos=()=>grupos.flatMap(g=>g.cuadros);
  const pintar=()=>{z.innerHTML=`${errores.length?`<div class="alert warn">No se pudieron leer: ${esc(errores.join("; "))}</div>`:""}
    <p class="note">Toque un cuadro para incluirlo o excluirlo.</p>
    ${grupos.map((g,gi)=>`<h5 style="font-size:1rem;margin:14px 0 8px">Video ${gi+1}: ${esc(g.nombre)} · ${fmtSeg(g.dur)}</h5>
      <div class="frames">${g.cuadros.map((q,i)=>`<div class="frame ${q.sel?"sel":""}" data-g="${gi}" data-i="${i}" role="checkbox" aria-checked="${q.sel}" tabindex="0"><img src="${q.url}" alt="Cuadro ${mmss(q.t)}"><span>${mmss(q.t)}</span></div>`).join("")}</div>`).join("")}
    <div class="row" style="margin-top:12px"><button class="btn orange" id="addFr">Agregar ${todos().filter(q=>q.sel).length} cuadro(s) a las evidencias</button><button class="btn alt sm" id="canFr">Descartar</button></div>`;
    z.querySelectorAll(".frame").forEach(fr=>{const q=grupos[+fr.dataset.g].cuadros[+fr.dataset.i];const tg=()=>{q.sel=!q.sel;pintar()};fr.onclick=tg;fr.onkeydown=ev=>{if(ev.key===" "||ev.key==="Enter"){ev.preventDefault();tg()}}});
    $("#canFr").onclick=()=>{z.innerHTML="";trabajando=false};
    $("#addFr").onclick=async()=>{
      const items=grupos.flatMap(g=>g.cuadros.filter(q=>q.sel).map(q=>({blob:q.blob,nota:`Cuadro del video «${g.nombre}» (${mmss(q.t)})`,origen:"video"})));
      if(!items.length)return;$("#addFr").disabled=true;z.insertAdjacentHTML("beforeend",'<p class="progress">Subiendo cuadros…</p>');
      await agregarFotos(S.sim[s.id],items);toast(`${items.length} cuadro(s) agregados`)};
  };
  pintar();
}

/* ---------- Paso 3: evaluación ---------- */
function evaluacionVacia(s,e){
  const sciNA=e.sci!=="Aplica";
  return {
    puntos:PUNTOS.map(p=>({n:p.n,cal:(p.n===5&&sciNA)?"No aplica":"",obs:(p.n===5&&sciNA)?"El establecimiento no tiene obligación de implementar el SCI.":"",rec:"",fotos:[],conf:""})),
    actividades:s.tipo==="De gabinete"?ACT_GAB.map(a=>({n:a.n,cal:"",obs:""})):[],
    resumen:"",recomendaciones:[],origen:"manual"
  };
}
function contexto(s,e){
  const m=s.medidos||{};const t=parseMMSS(m.tiempoEvac);
  return `ESTABLECIMIENTO
- Razón social: ${e.razonSocial}
- Nombre comercial: ${e.nombreComercial||"—"}
- Tipo de riesgo: ${e.riesgo}
- Sistema de Comando de Incidentes: ${e.sci}

SIMULACRO
- Número: ${s.numero}
- Fecha y hora: ${fFecha(s.fechaHora)}
- Tipo: ${s.tipo}
- Hipótesis: ${s.hipotesis}
- Alertamiento por alerta sísmica: ${s.alertaSismica?"Sí":"No"}
- Tiempo de evacuación recomendado: ${reglaEvac(s)}${esBomba(s)?"\n- Amenaza de bomba: no se activa la alarma; el aviso corre de voz en voz entre brigadistas":""}
- Tipo de evacuación: ${s.evacuacion}
- Programación: ${s.programacion||"—"}
${t!=null?`- Tiempo de evacuación medido: ${fmtSeg(t)} (${juicioEvac(s,t).txt})\n`:""}${m.poblacion?`- Población en el inmueble: ${m.poblacion}\n`:""}${m.evacuados?`- Personas evacuadas según conteo: ${m.evacuados}\n`:""}${m.brigadistas?`- Brigadistas participantes: ${m.brigadistas}\n`:""}${m.notas?`- Notas del evaluador en sitio: ${m.notas}\n`:""}${(s.videos||[]).filter(v=>v.analizar===false).length?`- Videos registrados que NO se te envían: ${s.videos.filter(v=>v.analizar===false).map(v=>v.desc||"video").join("; ")}\n`:""}
GUION Y CRONOLOGÍA
${(s.guion||"(no se capturó guion)").slice(0,60000)}`;
}
function criterios(s,e){
  const sciNA=e.sci!=="Aplica";
  return PUNTOS.map(p=>`${p.n}. ${p.t}: ${p.c}${p.n===5&&sciNA?" → El SCI NO APLICA a este establecimiento: califica \"No aplica\".":""}${p.n===4&&sciNA?" (Sin SCI, no exijas PC/ACV/AE.)":""}`).join("\n");
}
const MARCO=`Eres evaluador experto en Protección Civil en México (Grupo VIME). Evalúas simulacros conforme a la Ley Estatal de Protección Civil de Morelos y su Reglamento, la NT-SGIRPC-SIM-007-2024 (CDMX), la NOM-002-STPS-2010 y la NOM-010-SSPC-2019 (SCI). Escribe en español de México, en tono profesional, concreto y verificable. Basa cada observación en lo que realmente se ve en las fotos y videos o en lo que dice el guion; no inventes hechos. Cita las fotos por su número (Foto 3) y los videos con su etiqueta y minuto (V1 min 02:15). En los videos puedes medir tiempos: por ejemplo, desde que suena la alarma hasta que la última persona llega al punto de reunión. Si un punto no tiene evidencia suficiente, dilo y califica "Malo" con confianza "baja", explicando que no hay evidencia.

REGLAS OBLIGATORIAS DE EVALUACIÓN
1. NO compares los horarios del guion y la cronología con las horas o tiempos que aparecen en fotos y videos, y no penalices diferencias entre ellos. El guion es una planeación; el simulacro muestra el tiempo real, que sirve para mejorar. Sí aplica el tiempo recomendado de evacuación: menos de 3 minutos para cualquier emergencia y 50 segundos como máximo con alerta sísmica.
2. El personal NO debe portar equipo de protección personal (EPP): no lo evalúes, no lo menciones como deficiencia y no lo recomiendes.
3. Nunca escribas "personal directivo"; usa siempre "personal brigadista".
4. La llegada de apoyo externo (bomberos, ambulancias, Cruz Roja, SEDENA, policía, etc.) mencionada en el guion es simulada: no evalúes su llegada real. Evalúa solo que se registre la llamada de auxilio.
5. En amenaza de bomba no se activa la alarma y el aviso corre de voz en voz entre brigadistas: considera correcto ese alertamiento y no penalices que la evacuación tarde más de 3 minutos; evalúa que sea ordenada, completa y discreta.
6. En inmuebles que aplican el SCI, en el guion y la cronología el término "recursos" se refiere a los brigadistas y su equipo. Los recursos pueden estar asignados a la atención de la emergencia y/o en el Área de Espera (AE), donde pasan lista y esperan indicaciones. Interprétalo así al evaluar (no los confundas con recursos materiales externos ni con la población evacuada).`;

function listaEvidencias(fotos,videos,desde=1){
  const l=[];
  if(fotos.length) l.push("FOTOGRAFÍAS ADJUNTAS (en este orden)\n"+fotos.map((f,i)=>`Foto ${desde+i}: ${f.nota||"(sin nota)"}${f.origen==="video"?" [cuadro extraído de video]":""}`).join("\n"));
  if(videos.length) l.push("VIDEOS ADJUNTOS\n"+videos.map(v=>`${v.etiqueta}: ${v.desc||"video del simulacro"}`).join("\n"));
  return l.join("\n\n");
}

${hallazgos?"HALLAZGOS DE LOTES DE FOTOGRAFÍAS YA REVISADOS\n"+hallazgos+"\n\n":""}${evid||(hallazgos?"":"No hay fotos ni videos: califica la parte B con evidencia insuficiente.")}

{"puntos":[{"n":1,"cal":"Bueno|Regular|Malo|No aplica","obs":"qué dice o le falta al guion sobre este punto","rec":"qué agregar o corregir en el guion","fotos":[],"videos":[],"conf":"alta|media|baja"}, ... los 10 puntos ...],

function parseJSON(t){
  t=String(t||"").trim();
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {error:"json",mensaje:"La respuesta de Gemini no tuvo el formato esperado. Intente de nuevo."};
}
const LOTE_FOTOS=60;
async function analizar(s,e,out,btn){
  if(!S.ia){ try{ const p=await api("ping"); S.ia=p.ia; S.modelo=p.modelo; pintarEstado() }catch(e){} }
  if(!S.ia){out.innerHTML='<div class="alert err">El servidor no encuentra la clave de Gemini. En Apps Script → Configuración del proyecto → Propiedades del script, revise que la propiedad se llame exactamente <strong>GEMINI_API_KEY</strong> (mayúsculas, guiones bajos y sin espacios) y que el valor sea la clave de Google AI Studio. Después pulse de nuevo «Analizar evidencias».</div>';return}
  const gab=s.tipo==="De gabinete";
  const fotos=(s.fotos||[]).filter(f=>f.fileId);
  const vids=(s.videos||[]).map((v,i)=>({...v,etiqueta:"V"+(i+1),idx:i})).filter(v=>v.analizar!==false);
  if(!gab&&!fotos.length&&!vids.length){out.innerHTML='<div class="alert warn">Agregue fotografías o enlaces de video en el Paso 2 antes de analizar.</div>';return}
  if(gab&&!s.guion){out.innerHTML='<div class="alert warn">Capture el guion y la cronología en el Paso 1: es la base de la evaluación de gabinete.</div>';return}
  trabajando=true;btn.disabled=true;
  const P=t=>out.innerHTML=`<p class="progress">${esc(t)}</p>`;
  try{
    // 1) Videos de Drive → Gemini (se reutilizan durante 48 h)
    const listos=[];
    for(const v of vids){
      let g=v.gem;
      if(!g||!g.expira||new Date(g.expira)-Date.now()<3600e3){
        P(`Enviando el video ${v.etiqueta} desde su Drive a Gemini… (puede tardar un par de minutos)`);
        try{ g=await api("subirVideo",{url:v.url}) }
        catch(err){ if(err.error==="video"){ toast(`${v.etiqueta}: ${err.mensaje}`); continue } throw err }
        const cur=S.sim[s.id];const videos=cur.videos.map((x,i)=>i===v.idx?{...x,gem:{uri:g.uri,mime:g.mime,expira:g.expira}}:x);
        await guardar("simulacros",s.id,{...cur,videos});
      }
      listos.push({etiqueta:v.etiqueta,desc:v.desc,uri:g.uri,mime:g.mime});
    }
    if(!gab&&!fotos.length&&!listos.length) throw {mensaje:"Ningún video se pudo enviar a Gemini y no hay fotos. Revise los avisos de los videos o agregue fotos."};
    const build=gab?promptGabinete:promptCampo;
    let r;const actsLote=[];
    if(fotos.length<=LOTE_FOTOS){
      P(`Gemini está revisando ${fotos.length} foto(s)${listos.length?` y ${listos.length} video(s)`:""} con el guion… suele tardar de 1 a 3 minutos.`);
      r=await api("ia",{prompt:build(s,e,listaEvidencias(fotos,listos),null),fotos:fotos.map(f=>f.fileId),videos:listos});
    } else {
      const hall=[];
      for(let a=0;a<fotos.length;a+=LOTE_FOTOS){
        const b=Math.min(fotos.length,a+LOTE_FOTOS);
        P(`Revisando fotos ${a+1} a ${b} de ${fotos.length}…`);
        const rl=await api("ia",{prompt:promptLote(s,e,listaEvidencias(fotos.slice(a,b),[],a+1),a+1),fotos:fotos.slice(a,b).map(f=>f.fileId),desde:a});
        (parseJSON(rl.texto).hallazgos||[]).forEach(h=>{hall.push(`Foto ${h.foto}: ${h.ve}`);if(h.actividad)actsLote.push({foto:h.foto,actividad:h.actividad})});
      }
      P("Integrando la evaluación de los 10 puntos…");
      r=await api("ia",{prompt:build(s,e,listaEvidencias([],listos),hall.join("\n")),videos:listos});
    }
    const res=parseJSON(r.texto);
    const ev=normalizar(res,s,e);ev.modelo=r.modelo||"";
    // Actividad del guion que se aprecia en cada foto → pie de foto del reporte
    const acts=new Map();
    [...actsLote,...(Array.isArray(res.descFotos)?res.descFotos:[])].forEach(d=>{const n=+d.foto;if(n>0&&d.actividad)acts.set(n,limpiarTexto(String(d.actividad)))});
    const porId=new Map(fotos.map((f,i)=>[f.fileId,i+1]));
    const cur=S.sim[s.id];
    const fotosAct=(cur.fotos||[]).map(f=>{const n=porId.get(f.fileId);return n&&acts.has(n)?{...f,actividad:acts.get(n)}:f});
    trabajando=false;
    await guardar("simulacros",s.id,{...cur,fotos:fotosAct,evaluacion:ev});
    toast("Evaluación generada. Revísela y ajústela si lo considera necesario.");render();
  }catch(err){
    trabajando=false;btn.disabled=false;
    out.innerHTML=`<div class="alert err">${esc(err?.mensaje||err?.message||String(err))}</div>`;
    pendienteRender=false;
  }
}
function limpiarTexto(t){return String(t||"").replace(/personal directivo/gi,m=>m[0]==="P"?"Personal brigadista":"personal brigadista")}
function normalizar(r,s,e){
  const base=evaluacionVacia(s,e);
  const okCal=c=>["Bueno","Regular","Malo","No aplica"].includes(c)?c:"";
  base.puntos=base.puntos.map(p=>{const x=(r?.puntos||[]).find(q=>+q.n===p.n)||{};
    const cal=(p.n===5&&e.sci!=="Aplica")?"No aplica":okCal(x.cal);
    return {n:p.n,cal,obs:limpiarTexto((p.n===5&&e.sci!=="Aplica"&&!x.obs)?p.obs:String(x.obs||"")),rec:limpiarTexto(x.rec),fotos:Array.isArray(x.fotos)?x.fotos.map(Number).filter(n=>n>0):[],videos:Array.isArray(x.videos)?x.videos.map(String):[],conf:String(x.conf||"")}});
  if(s.tipo==="De gabinete") base.actividades=base.actividades.map(a=>{const x=(r?.actividades||[]).find(q=>+q.n===a.n)||{};return {n:a.n,cal:okCal(x.cal),obs:limpiarTexto(x.obs)}});
  base.resumen=limpiarTexto(r?.resumen);base.recomendaciones=(Array.isArray(r?.recomendaciones)?r.recomendaciones:[]).map(limpiarTexto);
  base.tiempoVideo=String(r?.tiempoEvacuacion||"");base.origen="ia";base.fechaIA=new Date().toISOString();
  return base;
}

}

/* ===================== Word (docx) ===================== */
const COL={navy:"17325C",orange:"E2711D",gold:"F0A81C",gray:"5B6676",line:"C9D2DF",soft:"EEF2F8",

async function bytesDe(url){const r=await fetch(url);if(!r.ok)throw new Error("no se pudo leer "+url);return new Uint8Array(await r.arrayBuffer())}

async function generarDocx(s,e,prog){

  const multi=(txt,o={})=>String(txt||"—").split(/\n/).map(l=>P([T(l,o)],{after:60}));
  const H=(txt)=>new Paragraph({children:[new TextRun({text:txt,font:F,size:28,bold:true,color:COL.navy})],spacing:{before:300,after:140},keepNext:true,border:{bottom:{style:BorderStyle.SINGLE,size:12,color:COL.orange,space:4}}});
  const bord={top:{style:BorderStyle.SINGLE,size:4,color:COL.line},bottom:{style:BorderStyle.SINGLE,size:4,color:COL.line},left:{style:BorderStyle.SINGLE,size:4,color:COL.line},right:{style:BorderStyle.SINGLE,size:4,color:COL.line}};
  const cell=(children,o={})=>new TableCell({children:Array.isArray(children)?children:[children],width:o.w?{size:o.w,type:WidthType.DXA}:undefined,shading:o.fill?{type:ShadingType.CLEAR,color:"auto",fill:o.fill}:undefined,margins:{top:80,bottom:80,left:110,right:110},verticalAlign:o.va||VerticalAlign.TOP,borders:bord,columnSpan:o.span});

  const wN=620,wP=2400,wC=1500,wO=W-wN-wP-wC;
  const hdr=(txt,w)=>cell(P([T(txt,{bold:true,color:"FFFFFF",size:20})],{after:0}),{w,fill:COL.navy,va:VerticalAlign.CENTER});
  const calCell=(cal,w)=>{const cc=COL[cal||""];return cell(P([T(cal||"Sin calificar",{bold:true,color:cc[0],size:20})],{align:AlignmentType.CENTER,after:0}),{w,fill:cc[1],va:VerticalAlign.CENTER})};
  body.push(new Table({width:{size:W,type:WidthType.DXA},columnWidths:[wN,wP,wC,wO],layout:TableLayoutType.FIXED,rows:[
    new TableRow({tableHeader:true,children:[hdr("No.",wN),hdr("Punto evaluado",wP),hdr("Calificación",wC),hdr("Observaciones detectadas",wO)]}),
    ...ev.puntos.map(p=>{const fs=(p.fotos||[]).filter(n=>n<=(s.fotos||[]).length);return new TableRow({cantSplit:true,children:[
      cell(P([T(p.n,{bold:true,color:COL.orange})],{align:AlignmentType.CENTER,after:0}),{w:wN}),
      cell(P([T(PUNTOS[p.n-1].t,{bold:true,size:20,color:COL.navy})],{after:0}),{w:wP}),
      calCell(p.cal,wC),
      cell([...multi(p.obs||"—",{size:20}),...(fs.length||(p.videos||[]).length?[P([T(evidTxt(fs,p.videos),{size:17,color:COL.gray,it:true})],{after:0})]:[])],{w:wO})
    ]})})]}));
  if(s.tipo==="De gabinete"&&(ev.actividades||[]).length){
    body.push(P([T("Actividades del simulacro de gabinete",{bold:true,color:COL.navy,size:23})],{before:240,after:100,keepNext:true}));
    const w1=620,w2=3200,w3=1500,w4=W-w1-w2-w3;
    body.push(new Table({width:{size:W,type:WidthType.DXA},columnWidths:[w1,w2,w3,w4],layout:TableLayoutType.FIXED,rows:[
      new TableRow({tableHeader:true,children:[hdr("No.",w1),hdr("Actividad",w2),hdr("Calificación",w3),hdr("Observaciones",w4)]}),
      ...ev.actividades.map(a=>new TableRow({cantSplit:true,children:[cell(P([T(a.n,{bold:true,color:COL.orange})],{align:AlignmentType.CENTER,after:0}),{w:w1}),cell(P([T(ACT_GAB[a.n-1].t,{bold:true,size:20,color:COL.navy})],{after:0}),{w:w2}),calCell(a.cal,w3),cell(multi(a.obs||"—",{size:20}),{w:w4})]}))]}));
  }

  // 6. Recomendaciones de mejora
  body.push(H("6. Recomendaciones de mejora"));
  const recP=ev.puntos.filter(p=>p.rec&&p.rec.trim());
  if(recP.length){
    body.push(P([T("Por punto evaluado",{bold:true,color:COL.navy,size:23})],{after:80,keepNext:true}));
    recP.forEach(p=>body.push(new Paragraph({spacing:{after:100,line:300},indent:{left:360,hanging:360},children:[T(`${p.n}. ${PUNTOS[p.n-1].t}: `,{bold:true,size:21}),T(p.rec,{size:21})]})));
  }
  if((ev.recomendaciones||[]).length){
    body.push(P([T("Recomendaciones generales",{bold:true,color:COL.navy,size:23})],{before:160,after:80,keepNext:true}));
    ev.recomendaciones.forEach((r,i)=>body.push(new Paragraph({spacing:{after:100,line:300},indent:{left:360,hanging:360},children:[T(`${i+1}.  `,{bold:true,color:COL.orange,size:21}),T(r,{size:21})]})));
  }
  if(!recP.length&&!(ev.recomendaciones||[]).length) body.push(P("Sin recomendaciones registradas."));

  if(s.incGuion&&s.guion){
    body.push(new Paragraph({children:[new PageBreak()]}));
    body.push(H("Anexo. Guion y cronología del simulacro"));
    s.guion.split("\n").forEach(l=>body.push(P([T(l,{size:20})],{after:40})));
  }

  prog("Compilando el archivo Word…");
  const doc=new Document({creator:s.evaluador||"Grupo VIME",title:"Evidencia Fotográfica y Evaluación de Simulacro",
    styles:{default:{document:{run:{font:F,size:22}}}},
    sections:[{properties:{page:{size:{width:12240,height:15840},margin:{top:1600,bottom:1100,left:1134,right:1134,header:500,footer:500}}},headers:{default:header},footers:{default:footer},children:body}]});
  return await Packer.toBlob(doc);
}

iniciar();
</script>
